<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ACAIL Angola · Proposta Smarty Squad</title>
<style>
  :root { --bg: #05090d; --fg: #e8edf2; --muted: #8c99a6; --accent: #9fc3ea; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; overflow: hidden; }
  .stage { position: fixed; inset: 0 0 48px 0; display: grid; place-items: center; padding: 16px; }
  .frame { position: relative; width: min(100%, calc((100vh - 80px) * 16 / 9)); aspect-ratio: 16 / 9; }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .35s ease; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .frame img.on { opacity: 1; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
  .bar button { background: none; border: 1px solid #263545; color: var(--fg); width: 36px; height: 30px; cursor: pointer; font-size: 14px; }
  .bar button:hover { border-color: var(--accent); }
  .nav { display: flex; gap: 8px; align-items: center; }
  .progress { position: fixed; left: 0; bottom: 48px; height: 2px; background: var(--accent); transition: width .35s ease; }
  .zone { position: fixed; top: 0; bottom: 48px; width: 30%; cursor: pointer; }
  .zone.l { left: 0; } .zone.r { right: 0; }
  @media (max-width: 600px) { .label { display: none; } }
</style>
</head>
<body>
<div class="stage"><div class="frame" id="frame"></div></div>
<div class="zone l" id="zl" aria-hidden="true"></div><div class="zone r" id="zr" aria-hidden="true"></div>
<div class="progress" id="prog"></div>
<div class="bar">
  <span class="label">SMARTY SQUAD × ACAIL · Proposta estratégica · Documento para discussão</span>
  <div class="nav">
    <button id="prev" aria-label="Diapositivo anterior">←</button>
    <span id="count">1 / 21</span>
    <button id="next" aria-label="Diapositivo seguinte">→</button>
    <button id="fs" aria-label="Ecrã inteiro">⤢</button>
  </div>
</div>
<script>
  const N = 21
  const frame = document.getElementById('frame')
  const imgs = Array.from({ length: N }, (_, i) => {
    const im = document.createElement('img')
    im.src = 'slides/s-' + String(i + 1).padStart(2, '0') + '.jpg'
    im.alt = 'Diapositivo ' + (i + 1)
    frame.appendChild(im)
    return im
  })
  let cur = 0
  try { cur = Math.min(N - 1, Math.max(0, parseInt(location.hash.slice(1)) - 1 || 0)) } catch (e) {}
  function show(i) {
    cur = Math.min(N - 1, Math.max(0, i))
    imgs.forEach((im, k) => im.classList.toggle('on', k === cur))
    document.getElementById('count').textContent = (cur + 1) + ' / ' + N
    document.getElementById('prog').style.width = ((cur + 1) / N * 100) + '%'
    history.replaceState(null, '', '#' + (cur + 1))
  }
  document.getElementById('prev').onclick = () => show(cur - 1)
  document.getElementById('next').onclick = () => show(cur + 1)
  document.getElementById('zl').onclick = () => show(cur - 1)
  document.getElementById('zr').onclick = () => show(cur + 1)
  document.getElementById('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()
  addEventListener('keydown', (e) => {
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); show(cur + 1) }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); show(cur - 1) }
    if (e.key === 'Home') show(0)
    if (e.key === 'End') show(N - 1)
    if (e.key === 'f') document.getElementById('fs').click()
  })
  let x0 = null
  addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX })
  addEventListener('touchend', (e) => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1)); x0 = null })
  show(cur)
</script>
</body>
</html>
